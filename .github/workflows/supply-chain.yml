on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pin-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every action is pinned to a commit SHA
        run: |
          # The version comment after the ref is the whole point of the
          # pin, so cut the comment off before looking at the ref.
          bad=$(grep -rn -E '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ \
            | sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]+$//' \
            | grep -v -E 'uses:[[:space:]]*\.' \
            | grep -v -E 'uses:[[:space:]]*[^[:space:]]+@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "Action refs not pinned to a 40 character commit SHA:"
            echo "$bad"
            exit 1
          fi
          echo "Every action ref is pinned to a commit SHA."
      - name: Check every Dockerfile FROM is pinned to a digest
        run: |
          bad=$(grep -n -E '^[[:space:]]*FROM[[:space:]]' Dockerfile* \
            | sed -E 's/[[:space:]]*#.*$//; s/[[:space:]]+$//' \
            | grep -v -i -E '@sha256:[0-9a-f]{64}([[:space:]]+AS[[:space:]]+[^[:space:]]+)?$' || true)
          if [ -n "$bad" ]; then
            echo "FROM directives not pinned to an image digest:"
            echo "$bad"
            exit 1
          fi
          echo "Every FROM directive is pinned to an image digest."

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          online-audits: false
          min-severity: medium

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  reproducibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads the tag history
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.15.2
          install-only: true
      - name: Build the release artifact with goreleaser
        run: goreleaser build --snapshot --clean --single-target -o /tmp/goreleaser-build
        env:
          # The newest tag may well be a helm/* one, which goreleaser
          # cannot parse as semver.
          GORELEASER_CURRENT_TAG: v0.0.0

      - name: Rebuild from source and compare digests
        run: |
          cp -a . /tmp/src-elsewhere
          cd /tmp/src-elsewhere
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 \
            go build -trimpath -ldflags="-s -w -buildid=" -o /tmp/plain-build .
          sha256sum /tmp/goreleaser-build /tmp/plain-build
          cmp /tmp/goreleaser-build /tmp/plain-build \
            && echo "Reproducible build confirmed"
