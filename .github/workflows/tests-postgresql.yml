on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'docker-compose.yml'
      - 'test/testdata/fixtures/**'
      - '.github/workflows/tests-postgresql.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'docker-compose.yml'
      - 'test/testdata/fixtures/**'
      - '.github/workflows/tests-postgresql.yml'

permissions: {}

jobs:
  tests-postgresql:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker compose up -d --wait --wait-timeout 90 db
      - run: go mod verify
      - run: go test -race ./...
        env:
          DATABASE_DSN: "postgres://postgres:postgres@localhost:5432/test?sslmode=disable"
          GOFLAGS: -mod=readonly
