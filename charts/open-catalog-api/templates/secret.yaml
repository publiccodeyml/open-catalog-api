{{- if not .Values.useExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "open-catalog-api.fullname" . }}
  labels:
    {{- include "open-catalog-api.labels" . | nindent 4 }}
type: Opaque
data:
  databaseDSN: {{ .Values.databaseDSN | b64enc }}
  pasetoKey: {{ .Values.pasetoKey | b64enc }}
{{- end }}
