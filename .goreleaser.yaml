# Make sure to check the documentation at https://goreleaser.com
version: 2
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...
builds:
  - binary: open-catalog-api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
archives:
  - formats:
      - tar.gz
sboms:
  - artifacts: archive

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  # The release body comes from CHANGELOG.md via --release-notes. A
  # generated commit list is not release notes for the OpenSSF badge.
  disable: true
dockers:
 -
   dockerfile: Dockerfile.goreleaser
   build_flag_templates:
     # Clamp every timestamp in the image to the commit date and drop
     # the BuildKit inline attestation, which embeds the build time
     # (CI attests provenance separately). A rebuild from the same
     # commit then produces the identical image. Needs a
     # docker-container builder.
     - "--build-arg=SOURCE_DATE_EPOCH={{ .CommitTimestamp }}"
     - "--provenance=false"
     - "--output=type=docker,rewrite-timestamp=true"
   image_templates:
     - "ghcr.io/publiccodeyml/open-catalog-api:{{ .Tag }}"
     - "ghcr.io/publiccodeyml/open-catalog-api:latest"
