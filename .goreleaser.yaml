# Make sure to check the documentation at https://goreleaser.com
version: 2
builds:
  - binary: open-catalog-api
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
archives:
  - formats:
      - tar.gz
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: README*
        info: &archive_info
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: LICENSE*
        info: *archive_info
      - src: CHANGELOG*
        info: *archive_info
sboms:
  - artifacts: archive

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  # The release body comes from CHANGELOG.md via --release-notes. A
  # generated commit list is not release notes for the OpenSSF badge.
  disable: true
dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    # Keep the existing image platform. GoReleaser defaults to arm64 too.
    platforms:
      - linux/amd64
    images:
      - ghcr.io/publiccodeyml/open-catalog-api
    tags:
      - "{{ .Tag }}"
      - "latest"
      # Moves only on final releases, so deployments that follow it never
      # get a release candidate. GoReleaser skips a tag that renders empty.
      - "{{ if not .Prerelease }}stable{{ end }}"
    # Inline attestations contain build timestamps. CI attests separately.
    sbom: "false"
    build_args:
      SOURCE_DATE_EPOCH: "{{ .CommitTimestamp }}"
    flags:
      - "--provenance=false"
      # Snapshots load into Docker. Releases push directly to the registry.
      # Both exporters must clamp timestamps to the commit date.
      - "--output=type={{ if .IsSnapshot }}docker{{ else }}image{{ end }},rewrite-timestamp=true"
