services:
  api:
    ports:
      - "3000:3000"
    depends_on:
      db:
        # The API panics when it cannot connect at startup.
        condition: service_healthy
    networks:
      - default
    volumes:
      - .:/opt/app/api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_DSN: 'host=db user=postgres password=postgres dbname=postgres port=5432'
      ENVIRONMENT: local

  db:
    # Same image the CI test job runs against
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: always
    healthcheck:
      # Over TCP: while the entrypoint creates the databases, Postgres
      # listens on the Unix socket only, so a socket check passes before
      # the API can connect.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The fixtures refuse to load into a database whose name has no
      # "test" in it, so the suite gets one of its own next to the
      # "postgres" database the api service uses.
      POSTGRES_DB: test
    ports:
      - '5432:5432'
