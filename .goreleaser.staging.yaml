# Goreleases configuration for staging builds, just builds and pushes
# the Docker image for the main branch.
#
# Make sure to check the documentation at https://goreleaser.com
version: 2

# Don't create a GitHub release
release:
  disable: true

builds:
  - binary: open-catalog-api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
     - -s -w -buildid=
    goos:
      - linux
dockers:
 -
   dockerfile: Dockerfile.goreleaser
   build_flag_templates:
     # Same reproducibility flags as .goreleaser.yaml: timestamps
     # clamped to the commit date, no inline attestation. Needs a
     # docker-container builder.
     - "--build-arg=SOURCE_DATE_EPOCH={{ .CommitTimestamp }}"
     - "--provenance=false"
     - "--output=type=docker,rewrite-timestamp=true"
   image_templates:
     - "ghcr.io/publiccodeyml/open-catalog-api:main"
